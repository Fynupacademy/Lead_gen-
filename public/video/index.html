<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>FynUp Consulting</title>
  <meta name="description" content="Quelques exemples de solutions de gestion sur mesure pour les entreprises.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="logo.png">
  <style>
    :root {
      --bg: #fafaf9;
      --text: #0b1220;
      --muted: #64748b;
      --line: #e2e8f0;
      --accent: #04abd7;
      --on-accent: #06222c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --line: #1e293b;
        --accent: #04abd7;
        --on-accent: #06222c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 440px;
      margin: 0 auto;
      padding: 28px 16px 40px;
    }
    .brand img {
      display: block;
      width: 56px;
      height: 56px;
      border-radius: 14px;
    }
    h1 {
      margin: 20px 0 20px;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 650;
    }
    .sub {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 15px;
    }
    .player {
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      border: 1px solid var(--line);
    }
    video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 78vh;
      background: #000;
    }
    .actions {
      display: grid;
      gap: 10px;
      margin-top: 20px;
    }
    .btn {
      display: block;
      padding: 14px 16px;
      border-radius: 12px;
      text-align: center;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      border: 1px solid var(--accent);
    }
    .btn.primary { background: var(--accent); color: var(--on-accent); }
    .btn.secondary { background: transparent; color: var(--text); border-color: var(--line); }
    .foot {
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    .foot a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="logo.png" alt="FynUp Consulting"></div>
    <h1>Quelques exemples de ce que je peux mettre en place</h1>

    <div class="player">
      <video controls playsinline preload="metadata" poster="poster.jpg">
        <source src="video.mp4" type="video/mp4">
        Votre navigateur ne peut pas lire cette vidéo.
      </video>
    </div>

    <div class="actions">
      <a class="btn primary" href="mailto:contact@fynup-consulting.ch?subject=Suite%20%C3%A0%20votre%20vid%C3%A9o">Me contacter</a>
      <a class="btn secondary" href="../plaquette/">Estimer les gains pour mon activité</a>
    </div>
  </main>
</body>
</html>
